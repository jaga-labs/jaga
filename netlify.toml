[build]
  publish = "site/"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ------------------------------------------------------
# PROXY REWRITE FOR PRIVATE TRANSLATION PORTAL
# This routes all traffic from jagalabs.netlify.app/translation/
# directly to the private Github repository deployment without changing the URL.
# ------------------------------------------------------
[[redirects]]
  from = "/translation/*"
  to = "https://translationtask.netlify.app/:splat"
  status = 200
  force = true
